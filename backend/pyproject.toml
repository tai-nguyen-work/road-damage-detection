[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "road-damage-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.2", "uvicorn==0.54.0", "SQLAlchemy==2.0.57",
  "alembic==1.20.1", "psycopg[binary]==3.2.13", "GeoAlchemy2==0.21.0",
  "pydantic-settings==2.16.2", "redis==8.1.0", "rq==3.0.0",
]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.4"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
